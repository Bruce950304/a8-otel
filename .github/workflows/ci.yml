name: CI

on:
  push:
  pull_request:

# 預設：整個 workflow 沒有任何權限
permissions: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 這個 job 只需要讀取程式碼
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt flake8 flake8-bandit pytest
      - name: Lint (flake8 + bandit security rules)
        run: flake8
      - name: Test
        run: pytest -v